<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>张丹丑照</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
        }

        /* 游戏容器 */
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #0a0f1e;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            scroll-behavior: smooth;
        }

        /* 隐藏滚动条 */
        .game-container::-webkit-scrollbar {
            width: 0;
        }

        /* 入场黑屏 */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        .intro-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .intro-text {
            color: #d4a574;
            font-size: 28px;
            letter-spacing: 6px;
            font-weight: bold;
            text-align: center;
            animation: introFlicker 1.5s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(212, 165, 116, 0.7);
        }
        @keyframes introFlicker {
            0%,
            100% {
                opacity: 1;
            }
            30% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
            70% {
                opacity: 0.3;
            }
            85% {
                opacity: 1;
            }
        }

        /* 场景切换动画 */
        .scene-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .scene-transition.hidden {
            opacity: 0;
        }
        .scene-transition-text {
            color: #d4a574;
            font-size: 24px;
            letter-spacing: 5px;
            text-align: center;
            animation: introFlicker 1s infinite;
        }

        /* 通用样式 */
        .status-bar {
            background: #151a26;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2a3040;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .bank-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #d4a574, #b8860b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .bank-name {
            color: #d4a574;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .bank-sub {
            color: #8899aa;
            font-size: 10px;
        }

        .main-content {
            padding: 20px 16px;
            min-height: 400px;
        }

        .step-title {
            color: #d4a574;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            color: #8899aa;
            font-size: 12px;
            margin-bottom: 6px;
            display: block;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: #252b3a;
            border: 2px solid #2a3040;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .form-input:focus {
            border-color: #d4a574;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-bottom: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4a574, #b8860b);
            color: #0a0f1e;
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #252b3a;
            color: #8899aa;
            border: 1px solid #2a3040;
        }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .btn-small {
            width: auto;
            padding: 10px 16px;
            font-size: 12px;
            display: inline-block;
            margin: 4px;
        }

        .notification {
            background: #252b3a;
            border-radius: 14px;
            padding: 16px;
            margin: 12px 0;
            border-left: 3px solid #d4a574;
        }
        .notification-title {
            color: #d4a574;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .notification-text {
            color: #8899aa;
            font-size: 12px;
            line-height: 1.7;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #252b3a;
            border-radius: 3px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4a574, #ff6b6b);
            width: 0%;
            transition: width 0.5s;
        }

        .score-display {
            text-align: center;
            padding: 25px 16px;
        }
        .score-number {
            font-size: 64px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 25px rgba(255, 68, 68, 0.5);
        }
        .score-label {
            color: #8899aa;
            font-size: 13px;
        }

        .scan-container {
            width: 180px;
            height: 180px;
            margin: 15px auto;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #2a3040;
            background: #1a1f2e;
        }
        .scan-face {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: scanMove 2s ease-in-out infinite;
        }
        .scan-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4444;
            border-radius: 50%;
            animation: dotPulse 0.8s ease-in-out infinite;
            box-shadow: 0 0 12px #ff4444;
        }
        .dot1 {
            top: 28%;
            left: 33%;
            animation-delay: 0s;
        }
        .dot2 {
            top: 23%;
            left: 53%;
            animation-delay: 0.3s;
        }
        .dot3 {
            top: 48%;
            left: 43%;
            animation-delay: 0.6s;
        }

        @keyframes scanMove {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }
        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(2.2);
                opacity: 0.4;
            }
        }

        .sms-bubble {
            background: #0a0f1e;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid #2a3040;
        }
        .sms-header {
            color: #8899aa;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .sms-content {
            color: #fff;
            font-size: 13px;
            line-height: 1.7;
        }

        .hidden {
            display: none !important;
        }

        /* 超市场景样式 */
        .shop-shelf {
            background: #1a2639;
            border-radius: 12px;
            padding: 14px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #2a3040;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .shop-shelf:active {
            transform: scale(0.96);
            background: #1f2b40;
        }
        .shelf-emoji {
            font-size: 36px;
            flex-shrink: 0;
        }
        .shelf-info {
            flex: 1;
        }
        .shelf-name {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .shelf-price {
            color: #d4a574;
            font-size: 12px;
        }
        .shelf-status {
            color: #ff4444;
            font-size: 11px;
        }

        .balance-display {
            background: #252b3a;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            margin: 10px 0;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: #ff4444;
        }
        .balance-label {
            color: #8899aa;
            font-size: 11px;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9997;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-box {
            background: #1e2433;
            border-radius: 16px;
            padding: 20px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            border: 2px solid #2a3040;
        }
        .popup-text {
            color: #fff;
            font-size: 14px;
            margin: 10px 0;
            line-height: 1.6;
        }
        .popup-emoji {
            font-size: 60px;
            margin: 10px 0;
        }

        @media (max-width: 400px) {
            .intro-text {
                font-size: 22px;
                letter-spacing: 4px;
            }
            .scan-container {
                width: 140px;
                height: 140px;
            }
            .score-number {
                font-size: 48px;
            }
            .balance-amount {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 入场动画 ========== -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-text">场景一<br>您来到颜值贷款游戏</div>
    </div>

    <!-- ========== 场景切换动画 ========== -->
    <div class="scene-transition hidden" id="sceneTransition">
        <div class="scene-transition-text" id="sceneTransitionText"></div>
    </div>

    <!-- ========== 游戏主容器 ========== -->
    <div class="game-container" id="gameContainer">

        <!-- ==================== 场景一：颜值贷款 ==================== -->
        <div id="scene1">
            <!-- 顶部状态栏 -->
            <div class="status-bar">
                <div class="bank-logo">💎</div>
                <div>
                    <div class="bank-name">颜值信贷</div>
                    <div class="bank-sub">FaceValue Credit Bureau</div>
                </div>
            </div>

            <div class="main-content" id="scene1Content">
                <!-- 步骤1: 输入信息 -->
                <div id="s1step1">
                    <div class="step-title">📋 贷款申请</div>
                    <div class="form-group">
                        <label class="form-label">申请人姓名</label>
                        <input type="text" class="form-input" id="nameInput" placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">申请金额</label>
                        <input type="text" class="form-input" id="amountInput" placeholder="请输入金额" value="1000000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">上传本人近照（颜值抵押评估）</label>
                        <input type="file" class="form-input" id="photoInput" accept="image/*" style="padding:10px;">
                    </div>
                    <button class="btn btn-primary" onclick="startApproval()">提交申请 ▶</button>
                </div>

                <!-- 步骤2-10 占位，动态填充 -->
                <div id="s1step2" class="hidden"></div>
                <div id="s1step3" class="hidden"></div>
                <div id="s1step4" class="hidden"></div>
                <div id="s1step5" class="hidden"></div>
                <div id="s1step6" class="hidden"></div>
                <div id="s1step7" class="hidden"></div>
                <div id="s1step8" class="hidden"></div>
                <div id="s1step9" class="hidden"></div>
                <div id="s1step10" class="hidden"></div>
            </div>
        </div>

        <!-- ==================== 场景二：颜值支付超市 ==================== -->
        <div id="scene2" class="hidden">
            <div class="status-bar">
                <div class="bank-logo">🛒</div>
                <div>
                    <div class="bank-name">颜值支付超市</div>
                    <div class="bank-sub">FaceValue Supermarket</div>
                </div>
            </div>

            <div class="main-content" id="scene2Content">
                <!-- 超市步骤动态填充 -->
            </div>
        </div>

    </div>

    <script>
        // ============ 全局变量 ============
        let userName = '';
        let userPhoto = null;
        let currentScene1Step = 1;
        let currentScene2Step = 0;
        let beautyScore = -250; // 颜值分数

        // ============ 入场动画 ============
        window.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('introScreen');
            // 3秒后淡出
            setTimeout(() => {
                introScreen.classList.add('fade-out');
                // 1秒后完全移除
                setTimeout(() => {
                    introScreen.style.display = 'none';
                }, 1000);
            }, 3000);
        });

        // ============ 场景切换 ============
        function switchToScene(sceneName) {
            const transition = document.getElementById('sceneTransition');
            const text = document.getElementById('sceneTransitionText');

            if (sceneName === 'scene2') {
                text.textContent = '场景二\n假如买东西可以用颜值支付';
            }

            transition.classList.remove('hidden');

            setTimeout(() => {
                transition.classList.add('hidden');
                document.getElementById('scene1').classList.add('hidden');
                document.getElementById('scene2').classList.remove('hidden');
                initScene2();
                document.getElementById('gameContainer').scrollTop = 0;
            }, 1500);
        }

        function showSceneTransition(textContent, callback) {
            const transition = document.getElementById('sceneTransition');
            const text = document.getElementById('sceneTransitionText');
            text.textContent = textContent;
            transition.classList.remove('hidden');
            setTimeout(() => {
                transition.classList.add('hidden');
                if (callback) callback();
            }, 1500);
        }

        // ============ 场景一：贷款流程 ============
        function hideAllScene1Steps() {
            for (let i = 1; i <= 10; i++) {
                const el = document.getElementById('s1step' + i);
                if (el) el.classList.add('hidden');
            }
        }

        function showScene1Step(step) {
            hideAllScene1Steps();
            const el = document.getElementById('s1step' + step);
            if (el) el.classList.remove('hidden');
            currentScene1Step = step;
            document.getElementById('scene1Content').scrollIntoView({ behavior: 'smooth' });
        }

        function startApproval() {
            userName = document.getElementById('nameInput').value || '无名氏';
            const file = document.getElementById('photoInput').files[0];
            if (!file) { alert('请上传您的近照！'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                userPhoto = e.target.result;
                buildScene1Step2();
                showScene1Step(2);
            };
            reader.readAsDataURL(file);
        }

        // 征信报告
        function buildScene1Step2() {
            const container = document.getElementById('s1step2');
            const records = [
                '曾在超市试吃区被店员驱赶3次',
                '自拍美颜参数过高，涉嫌欺诈',
                '表情包库存128张，但无一能用',
                '在朋友圈发鸡汤文被屏蔽87次',
                '网购退货率97%，原因：穿不上',
                '深夜点外卖被邻居投诉咀嚼声',
            ];
            const shuffled = records.sort(() => Math.random() - 0.5).slice(0, 4);
            let html = `
            <div class="step-title">🔍 正在调取征信报告...</div>
            <div class="progress-bar"><div class="progress-fill" style="width:30%;"></div></div>
            <div class="notification">
              <div class="notification-title">📄 个人征信报告</div>
              <div class="notification-text">
                <strong>${userName}</strong> 的征信记录：<br><br>
                ${shuffled.map(r => '• ' + r).join('<br>')}
                <br><br><span style="color:#ff4444;">信用评级：F- (极差)</span>
              </div>
            </div>
            <button class="btn btn-primary" onclick="buildScene1Step3();showScene1Step(3);">继续审核 ▶</button>
          `;
            container.innerHTML = html;
        }

        // 面部扫描
        function buildScene1Step3() {
            const container = document.getElementById('s1step3');
            container.innerHTML = `
            <div class="step-title">📸 面部特征扫描中...</div>
            <div class="scan-container">
              <img class="scan-face" src="${userPhoto}" style="display:block;">
              <div class="scan-line"></div>
              <div class="scan-dot dot1"></div>
              <div class="scan-dot dot2"></div>
              <div class="scan-dot dot3"></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:60%;"></div></div>
            <p style="color:#8899aa;text-align:center;font-size:12px;">正在分析鼻孔对称度、双下巴指数...</p>
            <button class="btn btn-primary" onclick="buildScene1Step4();showScene1Step(4);">查看扫描结果 ▶</button>
          `;
        }

        // 财产证明
        function buildScene1Step4() {
            const container = document.getElementById('s1step4');
            const assets = [
                '表情包库存：128张',
                '朋友圈点赞数：3个（含自己）',
                '自拍杆：2根（已折断1根）',
                '美颜APP会员：已过期687天',
                '口罩：37个（款式均不时尚）',
            ];
            const selected = assets.sort(() => Math.random() - 0.5).slice(0, 3);
            container.innerHTML = `
            <div class="step-title">💰 抵押物评估</div>
            <div class="notification">
              <div class="notification-title">🏦 资产清单</div>
              <div class="notification-text">${selected.map(a => '• ' + a).join('<br>')}</div>
            </div>
            <div class="notification">
              <div class="notification-title">📊 评估结果</div>
              <div class="notification-text">评估总价值：<span style="color:#ff4444;font-size:18px;">¥0.00001</span><br><small>（还不够支付本次审批手续费）</small></div>
            </div>
            <button class="btn btn-primary" onclick="buildScene1Step5();showScene1Step(5);">进入担保审核 ▶</button>
          `;
        }

        // 担保人
        function buildScene1Step5() {
            const container = document.getElementById('s1step5');
            container.innerHTML = `
            <div class="step-title">👥 担保人身份核实</div>
            <div style="text-align:center;margin:15px 0;">
              <img src="${userPhoto}" style="max-width:160px;border-radius:12px;" alt="担保人">
              <p style="color:#d4a574;font-size:16px;margin:12px 0;">请确认这是您本人吗？</p>
              <button class="btn btn-secondary" onclick="fakeGuarantor()">是（本人确认）</button>
              <button class="btn btn-secondary" onclick="fakeGuarantor()">不是（诚实回答）</button>
            </div>
          `;
        }

        function fakeGuarantor() {
            alert('验证失败！照片与本人相似度：2%\n（那2%是因为都有两个鼻孔）');
            buildScene1Step6();
            showScene1Step(6);
        }

        // 审批结果
        function buildScene1Step6() {
            const container = document.getElementById('s1step6');
            const score = Math.floor(Math.random() * 200) - 350;
            beautyScore = score;
            const details = [
                '鼻孔对称度：0%（稀有物种）',
                '双下巴指数：突破系统上限',
                '发际线海拔：持续上升中',
                '眼皮单双程度：左右不一致，评级D',
                '微笑弧度：检测失败，疑似面瘫',
            ];
            const selected = details.sort(() => Math.random() - 0.5).slice(0, 3);
            container.innerHTML = `
            <div class="step-title">📝 最终审批结果</div>
            <div class="score-display">
              <div class="score-number">${score}</div>
              <div class="score-label">颜值评分</div>
            </div>
            <div class="notification">
              <div class="notification-title">🔬 详细分析报告</div>
              <div class="notification-text">
                ${selected.map(d => '• ' + d).join('<br>')}
                <br><br>• 综合结论：<span style="color:#ff4444;">不建议放贷，建议报警</span>
              </div>
            </div>
            <button class="btn btn-primary" onclick="buildScene1Step7();showScene1Step(7);">继续 ▶</button>
          `;
        }

        // 短信通知
        function buildScene1Step7() {
            const container = document.getElementById('s1step7');
            const reasons = ['照片太丑，系统死机了', '颜值评分低于监狱平均水平', '您已被列入"重点观察对象"', 'AI拒绝分析，要求加薪'];
            container.innerHTML = `
            <div class="step-title">📱 系统通知</div>
            <div class="sms-bubble">
              <div class="sms-header">【颜值银行】 10秒前</div>
              <div class="sms-content">
                尊敬的${userName}：<br><br>
                您的贷款申请已被<strong>拒绝</strong>。<br><br>
                拒绝理由：${reasons[Math.floor(Math.random()*reasons.length)]}<br><br>
                如有疑问，请照镜子自行反思。
              </div>
            </div>
            <button class="btn btn-primary" onclick="buildScene1Step8();showScene1Step(8);">查看还款方案 ▶</button>
          `;
        }
